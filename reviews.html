<div id="gd-review-board-page">
  <section class="gd-section gd-review-board-section">
    <div class="gd-inner">

      <div class="gd-review-board-heading">
        <div>
          <div class="gd-kicker">CUSTOMER VOICES</div>
          <h2 class="gd-title">고객 연수후기</h2>
          <p>고객이 남긴 연수 관련 게시글을 목록으로 확인하고, 제목을 눌러 내용을 읽어보세요.</p>
        </div>
        <div class="gd-review-board-count">
          <strong id="gdBoardTotal">41</strong>
          <span>TOTAL POSTS</span>
        </div>
      </div>

      <div class="gd-review-board-toolbar">
        <div class="gd-review-board-summary">
          <span class="gd-board-status-dot"></span>
          등록된 게시글 <strong id="gdBoardMatch">41</strong>건
        </div>
        <label class="gd-review-board-search">
          <span aria-hidden="true">⌕</span>
          <input type="search" id="gdBoardSearch" placeholder="제목 · 본문 검색" aria-label="연수후기 검색" autocomplete="off">
        </label>
      </div>

      <div class="gd-review-board-table" role="region" aria-label="고객 연수후기 게시판">
        <div class="gd-board-row gd-board-head">
          <span>번호</span>
          <span>제목</span>
          <span>작성자</span>
          <span>작성일</span>
          <span>조회</span>
        </div>
        <div id="gdBoardRows"></div>
        <div id="gdBoardEmpty" class="gd-board-empty" hidden>
          검색 결과가 없습니다.
        </div>
      </div>

      <nav class="gd-board-pagination" id="gdBoardPagination" aria-label="후기 페이지 이동"></nav>

      <p class="gd-review-board-source">
        엑셀에서 이전한 기존 게시글 자료입니다. 작성자명은 일부 가림 처리했으며, 원문에 기재된 상호명은 후기의 출처를 왜곡하지 않기 위해 유지했습니다. 각 게시글의 조회수는 엑셀 내보내기 당시 수치입니다.
      </p>

    </div>
  </section>
</div>

<script src="reviews-data-1.js"></script>
<script src="reviews-data-2.js"></script>
<script src="reviews-board.js"></script>
